name: Update profile assets

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator requirements
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Regenerate profile assets
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/generate_header.py
          python scripts/generate_terminal_card.py
          python scripts/generate_skills.py
          python scripts/fetch_contributions.py
          python scripts/generate_contribution_graph.py
          python scripts/validate_profile.py

      - name: Commit changed assets
        run: |
          git add assets data/contributions.json
          if git diff --cached --quiet; then
            echo "Profile assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile assets"
          git push
