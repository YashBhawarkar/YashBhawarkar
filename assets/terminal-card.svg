<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Yash Bhawarkar system profile</title>
  <desc id="desc">A terminal-inspired card describing Yash's AI and machine-learning engineering role, location, education, technical focus, languages, cloud platforms, data tools, and AI frameworks.</desc>
  <style>

    svg {
      --canvas: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #eef3f8;
      --border: #cbd5e1;
      --text: #132238;
      --muted: #5f7187;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --soft-accent: #ccfbf1;
      --shadow: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --canvas: #080f1b;
        --surface: #0f1928;
        --surface-2: #152235;
        --border: #293a52;
        --text: #e6edf7;
        --muted: #91a4bb;
        --accent: #5eead4;
        --accent-2: #60a5fa;
        --soft-accent: #123b3a;
        --shadow: #020617;
      }
    }
    .canvas { fill: var(--canvas); }
    .surface { fill: var(--surface); stroke: var(--border); }
    .surface-2 { fill: var(--surface-2); }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
    .border-stroke { stroke: var(--border); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    .bar-title { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .section { font-size: 12px; font-weight: 800; letter-spacing: 2.2px; }
    .key { fill: var(--accent); font-size: 15px; font-weight: 700; }
    .divider { fill: var(--muted); font-size: 15px; }
    .value { font-size: 15px; font-weight: 540; }
    .row { opacity: 0; animation: row-in .55s cubic-bezier(.2,.8,.2,1) forwards; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes row-in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes scan { from { transform: translateX(-250px); opacity: 0; } 15%,85% { opacity: .32; } to { transform: translateX(1250px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="scan-gradient" x1="0" x2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity="0"/>
      <stop offset=".5" stop-color="var(--accent)" stop-opacity=".55"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="canvas" width="1200" height="440" rx="20"/>
  <rect class="surface" x="24" y="20" width="1152" height="396" rx="15"/>
  <rect class="surface-2" x="25" y="21" width="1150" height="55" rx="14"/>
  <path class="border-stroke" d="M25 76H1175"/>
  <circle cx="51" cy="48" r="5" fill="#ef6b73"/>
  <circle cx="69" cy="48" r="5" fill="#eab308"/>
  <circle cx="87" cy="48" r="5" fill="#10b981"/>
  <text class="mono bar-title text" x="110" y="53">yash@profile: ~/system-info</text>
  <circle class="pulse accent" cx="1057" cy="48" r="4"/>
  <text class="mono muted" x="1070" y="52" font-size="11">PROCESS ACTIVE</text>

  <rect class="scan" x="0" y="77" width="220" height="2" fill="url(#scan-gradient)"/>
  <text class="mono section muted" x="60" y="112">SYSTEM PROFILE</text>
  <text class="mono section muted" x="635" y="112">TOOLCHAIN</text>
  <path class="border-stroke" d="M600 97V383" stroke-dasharray="3 7" opacity=".75"/>


    <g class="row" style="animation-delay:0.00s">
      <text class="mono key" x="60" y="155">Role</text>
      <text class="mono divider" x="155" y="155">→</text>
      <text class="mono value text" x="180" y="155">AI / ML Engineer</text>
    </g>
    <g class="row" style="animation-delay:0.09s">
      <text class="mono key" x="60" y="205">Location</text>
      <text class="mono divider" x="155" y="205">→</text>
      <text class="mono value text" x="180" y="205">Michigan, USA</text>
    </g>
    <g class="row" style="animation-delay:0.18s">
      <text class="mono key" x="60" y="255">Education</text>
      <text class="mono divider" x="155" y="255">→</text>
      <text class="mono value text" x="180" y="255">M.S. Computer Science @ MSU</text>
    </g>
    <g class="row" style="animation-delay:0.27s">
      <text class="mono key" x="60" y="305">Focus</text>
      <text class="mono divider" x="155" y="305">→</text>
      <text class="mono value text" x="180" y="305">AI • ML • GenAI • Data</text>
    </g>
    <g class="row" style="animation-delay:0.36s">
      <text class="mono key" x="60" y="355">Status</text>
      <text class="mono divider" x="155" y="355">→</text>
      <text class="mono value text" x="180" y="355">Building intelligent systems</text>
    </g>

    <g class="row" style="animation-delay:0.18s">
      <text class="mono key" x="635" y="155">Languages</text>
      <text class="mono divider" x="740" y="155">→</text>
      <text class="mono value text" x="765" y="155">Python • JavaScript • SQL</text>
    </g>
    <g class="row" style="animation-delay:0.27s">
      <text class="mono key" x="635" y="205">Cloud</text>
      <text class="mono divider" x="740" y="205">→</text>
      <text class="mono value text" x="765" y="205">Azure • AWS • GCP</text>
    </g>
    <g class="row" style="animation-delay:0.36s">
      <text class="mono key" x="635" y="255">Data</text>
      <text class="mono divider" x="740" y="255">→</text>
      <text class="mono value text" x="765" y="255">Databricks • Spark</text>
    </g>
    <g class="row" style="animation-delay:0.45s">
      <text class="mono key" x="635" y="305">AI</text>
      <text class="mono divider" x="740" y="305">→</text>
      <text class="mono value text" x="765" y="305">PyTorch • TensorFlow • LangChain</text>
    </g>
    <g class="row" style="animation-delay:0.54s">
      <text class="mono key" x="635" y="355">Runtime</text>
      <text class="mono divider" x="740" y="355">→</text>
      <text class="mono value text" x="765" y="355">Backend • Full-stack • REST APIs</text>
    </g>

  <path class="border-stroke" d="M60 383H1140" opacity=".7"/>
  <text class="mono muted" x="60" y="405" font-size="11">$ profile --mode production-minded --output dependable-systems</text>
  <rect class="pulse accent" x="477" y="392" width="7" height="14" rx="1"/>
</svg>
