<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Engineering capability matrix</title>
  <desc id="desc">Yash Bhawarkar's selected technologies grouped into AI and machine learning, data engineering, backend, cloud and DevOps, and research.</desc>
  <style>

    svg {
      --canvas: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #eef3f8;
      --border: #cbd5e1;
      --text: #132238;
      --muted: #5f7187;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --soft-accent: #ccfbf1;
      --shadow: #94a3b8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --canvas: #080f1b;
        --surface: #0f1928;
        --surface-2: #152235;
        --border: #293a52;
        --text: #e6edf7;
        --muted: #91a4bb;
        --accent: #5eead4;
        --accent-2: #60a5fa;
        --soft-accent: #123b3a;
        --shadow: #020617;
      }
    }
    .canvas { fill: var(--canvas); }
    .surface { fill: var(--surface); stroke: var(--border); }
    .surface-2 { fill: var(--surface-2); }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
    .border-stroke { stroke: var(--border); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    .heading { font-size: 25px; font-weight: 760; letter-spacing: -.4px; }
    .subheading { font-size: 12px; font-weight: 700; letter-spacing: 1.7px; }
    .number { font-size: 11px; font-weight: 700; }
    .card-title { font-size: 14px; font-weight: 760; letter-spacing: .7px; }
    .item { font-size: 13px; font-weight: 550; }
    .skill { opacity: 0; animation: skill-in .5s ease-out forwards; }
    .card { animation: card-in .65s ease-out both; }
    .marker { animation: marker 3.4s ease-in-out infinite; }
    @keyframes skill-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes card-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes marker { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect class="canvas" width="1200" height="490" rx="20"/>
  <text class="sans heading text" x="30" y="47">Engineering capability matrix</text>
  <text class="mono subheading muted" x="1170" y="45" text-anchor="end">SELECTED TOOLS / FOCUSED PRACTICE</text>
  <path class="border-stroke" d="M30 66H1170"/>

  <g class="card">
    <rect class="surface" x="30" y="80" width="555" height="185" rx="14"/>
    <rect class="accent marker" x="30" y="102" width="4" height="33" rx="2"/>
    <text class="mono number muted" x="54" y="115">01</text>
    <text class="sans card-title text" x="92" y="116">AI / ML</text>
    <path class="border-stroke" d="M54 138H561" opacity=".75"/>

      <g class="skill" style="animation-delay:0.080s">
        <circle class="accent" cx="58" cy="157" r="3"/>
        <text class="mono item text" x="70" y="162">PyTorch</text>
      </g>
      <g class="skill" style="animation-delay:0.115s">
        <circle class="accent" cx="317" cy="157" r="3"/>
        <text class="mono item text" x="329" y="162">TensorFlow</text>
      </g>
      <g class="skill" style="animation-delay:0.150s">
        <circle class="accent" cx="58" cy="187" r="3"/>
        <text class="mono item text" x="70" y="192">scikit-learn</text>
      </g>
      <g class="skill" style="animation-delay:0.185s">
        <circle class="accent" cx="317" cy="187" r="3"/>
        <text class="mono item text" x="329" y="192">LangChain</text>
      </g>
      <g class="skill" style="animation-delay:0.220s">
        <circle class="accent" cx="58" cy="217" r="3"/>
        <text class="mono item text" x="70" y="222">FAISS</text>
      </g>
      <g class="skill" style="animation-delay:0.255s">
        <circle class="accent" cx="317" cy="217" r="3"/>
        <text class="mono item text" x="329" y="222">Chroma</text>
      </g>
      <g class="skill" style="animation-delay:0.290s">
        <circle class="accent" cx="58" cy="247" r="3"/>
        <text class="mono item text" x="70" y="252">Azure OpenAI</text>
      </g>
      <g class="skill" style="animation-delay:0.325s">
        <circle class="accent" cx="317" cy="247" r="3"/>
        <text class="mono item text" x="329" y="252">RAG</text>
      </g>
  </g>
  <g class="card">
    <rect class="surface" x="615" y="80" width="555" height="185" rx="14"/>
    <rect class="accent marker" x="615" y="102" width="4" height="33" rx="2"/>
    <text class="mono number muted" x="639" y="115">02</text>
    <text class="sans card-title text" x="677" y="116">DATA ENGINEERING</text>
    <path class="border-stroke" d="M639 138H1146" opacity=".75"/>

