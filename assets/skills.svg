        <circle class="accent" cx="643" cy="157" r="3"/>
        <text class="mono item text" x="655" y="162">PySpark</text>
      </g>
      <g class="skill" style="animation-delay:0.195s">
        <circle class="accent" cx="902" cy="157" r="3"/>
        <text class="mono item text" x="914" y="162">Databricks</text>
      </g>
      <g class="skill" style="animation-delay:0.230s">
        <circle class="accent" cx="643" cy="187" r="3"/>
        <text class="mono item text" x="655" y="192">SQL</text>
      </g>
      <g class="skill" style="animation-delay:0.265s">
        <circle class="accent" cx="902" cy="187" r="3"/>
        <text class="mono item text" x="914" y="192">Delta Lake</text>
      </g>
      <g class="skill" style="animation-delay:0.300s">
        <circle class="accent" cx="643" cy="217" r="3"/>
        <text class="mono item text" x="655" y="222">Entity Resolution</text>
      </g>
      <g class="skill" style="animation-delay:0.335s">
        <circle class="accent" cx="902" cy="217" r="3"/>
        <text class="mono item text" x="914" y="222">Data Pipelines</text>
      </g>
  </g>
  <g class="card">
    <rect class="surface" x="30" y="280" width="360" height="180" rx="14"/>
    <rect class="accent marker" x="30" y="302" width="4" height="33" rx="2"/>
    <text class="mono number muted" x="54" y="315">03</text>
    <text class="sans card-title text" x="92" y="316">BACKEND</text>
    <path class="border-stroke" d="M54 338H366" opacity=".75"/>

      <g class="skill" style="animation-delay:0.240s">
        <circle class="accent" cx="58" cy="357" r="3"/>
        <text class="mono item text" x="70" y="362">Python</text>
      </g>
      <g class="skill" style="animation-delay:0.275s">
        <circle class="accent" cx="58" cy="387" r="3"/>
        <text class="mono item text" x="70" y="392">Node.js</text>
      </g>
      <g class="skill" style="animation-delay:0.310s">
        <circle class="accent" cx="58" cy="417" r="3"/>
        <text class="mono item text" x="70" y="422">JavaScript</text>
      </g>
      <g class="skill" style="animation-delay:0.345s">
        <circle class="accent" cx="58" cy="447" r="3"/>
        <text class="mono item text" x="70" y="452">REST APIs</text>
      </g>
  </g>
  <g class="card">
    <rect class="surface" x="420" y="280" width="360" height="180" rx="14"/>
    <rect class="accent marker" x="420" y="302" width="4" height="33" rx="2"/>
    <text class="mono number muted" x="444" y="315">04</text>
    <text class="sans card-title text" x="482" y="316">CLOUD / DEVOPS</text>
    <path class="border-stroke" d="M444 338H756" opacity=".75"/>

      <g class="skill" style="animation-delay:0.320s">
        <circle class="accent" cx="448" cy="357" r="3"/>
        <text class="mono item text" x="460" y="362">Azure</text>
      </g>
      <g class="skill" style="animation-delay:0.355s">
        <circle class="accent" cx="610" cy="357" r="3"/>
        <text class="mono item text" x="622" y="362">AWS</text>
      </g>
      <g class="skill" style="animation-delay:0.390s">
        <circle class="accent" cx="448" cy="387" r="3"/>
        <text class="mono item text" x="460" y="392">GCP</text>
      </g>
      <g class="skill" style="animation-delay:0.425s">
        <circle class="accent" cx="610" cy="387" r="3"/>
        <text class="mono item text" x="622" y="392">Docker</text>
      </g>
      <g class="skill" style="animation-delay:0.460s">
        <circle class="accent" cx="448" cy="417" r="3"/>
        <text class="mono item text" x="460" y="422">Git</text>
      </g>
  </g>
  <g class="card">
    <rect class="surface" x="810" y="280" width="360" height="180" rx="14"/>
    <rect class="accent marker" x="810" y="302" width="4" height="33" rx="2"/>
    <text class="mono number muted" x="834" y="315">05</text>
    <text class="sans card-title text" x="872" y="316">RESEARCH</text>
    <path class="border-stroke" d="M834 338H1146" opacity=".75"/>

      <g class="skill" style="animation-delay:0.400s">
        <circle class="accent" cx="838" cy="357" r="3"/>
        <text class="mono item text" x="850" y="362">Applied ML</text>
      </g>
      <g class="skill" style="animation-delay:0.435s">
        <circle class="accent" cx="838" cy="387" r="3"/>
        <text class="mono item text" x="850" y="392">Single-cell RNA-seq</text>
      </g>
      <g class="skill" style="animation-delay:0.470s">
        <circle class="accent" cx="838" cy="417" r="3"/>
        <text class="mono item text" x="850" y="422">scGen / scVIDR</text>
      </g>
      <g class="skill" style="animation-delay:0.505s">
        <circle class="accent" cx="838" cy="447" r="3"/>
        <text class="mono item text" x="850" y="452">Model Evaluation</text>
      </g>
  </g>
  <text class="mono muted" x="30" y="480" font-size="10">A cohesive toolkit for data-intensive, production-minded AI systems.</text>
</svg>
